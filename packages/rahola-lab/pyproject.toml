[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rahola-lab"
version = "0.1.0"
description = "Reference campaigns and conformal alarm experiments for Rahola"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jax>=0.4.38",
  "matplotlib>=3.9",
  "numpy>=2.1",
  "pyarrow>=18",
  "pyyaml>=6.0",
  "rahola",
  "scipy>=1.14",
  "xgboost>=3.0",
]

[project.scripts]
rahola-lab = "rahola_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rahola_lab"]

[tool.uv.sources]
rahola = { workspace = true }
