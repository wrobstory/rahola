name: parametric_ramp
role: prototype2_ramp
rationale: crossing zero stiffness to -0.065 produced 27.4% capsize in 2,048 pilot runs.
splits:
  train: {count: 2000, offset: 25000}
simulation:
  family: parametric
  duration_s: 600.0
  natural_period_s: 4.0
  escape_angle_rad: 0.6108652381980153
  damping_ratio: 0.05
  quadratic_damping: 0.02
  output_rate_hz: 2.0
  forcing:
    sea_state: {hs_m: 1.0, tp_s: 2.0, gamma: 3.3}
    effective_wave_slope: 0.002
    min_components: 200
  parametric:
    mode: stochastic
    stochastic_std: 0.20
  protocol:
    kind: ramped
    ramp_parameter: stiffness
    ramp_start: 1.2
    ramp_end: -0.065

