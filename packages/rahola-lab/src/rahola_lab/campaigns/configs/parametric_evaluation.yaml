name: parametric_evaluation
role: rare_event_evaluation
rationale: stochastic stiffness RMS 0.33 produced 0.88% capsize in a 2048-seed pilot.
splits:
  calibration: {count: 1000, offset: 60000}
  test: {count: 5000, offset: 60000}
simulation:
  family: parametric
  duration_s: 600.0
  natural_period_s: 4.0
  escape_angle_rad: 0.6108652381980153
  damping_ratio: 0.05
  quadratic_damping: 0.02
  output_rate_hz: 2.0
  forcing:
    sea_state: {hs_m: 1.0, tp_s: 2.0, gamma: 3.3}
    effective_wave_slope: 0.002
    min_components: 200
  parametric:
    mode: stochastic
    stochastic_std: 0.33
  protocol: {kind: stationary}
